name: Cleanup tournament runtime contract

on:
  push:
    branches:
      - stabilization/vcl-2.1-cleanup
    paths:
      - .github/workflows/cleanup-tournament-runtime-contract.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stabilization/vcl-2.1-cleanup
          fetch-depth: 0

      - name: Align public tournament runtime with canonical contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          script_path = Path('script.js')
          script = script_path.read_text()
          old_results = (
              '          VCLData.getTournamentMatches(tournament.id),\n'
              '          VCLData.getTournamentResults ? VCLData.getTournamentResults(tournament.id) : Promise.resolve([])\n'
          )
          new_results = (
              '          VCLData.getTournamentMatches(tournament.id),\n'
              '          VCLData.getTournamentResults(tournament.id)\n'
          )
          if script.count(old_results) != 1:
              raise SystemExit(f'Expected one optional tournament results branch, found {script.count(old_results)}')
          script = script.replace(old_results, new_results, 1)
          script_path.write_text(script)

          data_path = Path('assets/js/vclData.js')
          data = data_path.read_text()
          old_source = (
              '    async getTournamentBySlug(slug) {\n'
              '      const { data, error } = await db\n'
              '        .from("tournaments")\n'
              '        .select("*")\n'
              '        .eq("slug", slug)\n'
              '        .maybeSingle();\n'
          )
          new_source = (
              '    async getTournamentBySlug(slug) {\n'
              '      const { data, error } = await db\n'
              '        .from("public_tournaments_view")\n'
              '        .select("*")\n'
              '        .eq("slug", slug)\n'
              '        .maybeSingle();\n'
          )
          if data.count(old_source) != 1:
              raise SystemExit(f'Expected one public tournament detail source, found {data.count(old_source)}')
          data = data.replace(old_source, new_source, 1)
          data_path.write_text(data)
          PY

      - name: Run static frontend audit
        run: node tools/vcl-static-audit.mjs

      - name: Commit cleanup
        run: |
          git rm .github/workflows/cleanup-tournament-runtime-contract.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js assets/js/vclData.js
          git commit -m "Align public tournament runtime contract"
          git push origin HEAD:stabilization/vcl-2.1-cleanup
