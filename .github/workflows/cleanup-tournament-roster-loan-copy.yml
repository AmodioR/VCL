name: Cleanup tournament roster loan copy

on:
  push:
    branches:
      - stabilization/vcl-2.1-cleanup
    paths:
      - .github/workflows/cleanup-tournament-roster-loan-copy.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stabilization/vcl-2.1-cleanup
          fetch-depth: 0

      - name: Update shipped loan copy
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('assets/js/tournamentEntryFlow.js')
          text = path.read_text(encoding='utf-8')
          old = 'Stand-ins og lån bliver håndteret separat i den kommende loan-funktion og ændrer ikke permanent team membership.'
          new = 'Stand-ins og lån håndteres separat i turneringsrosteren og ændrer ikke permanent team membership.'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one stale loan copy, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit cleanup
        run: |
          git rm .github/workflows/cleanup-tournament-roster-loan-copy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/tournamentEntryFlow.js
          git commit -m "Update tournament roster loan copy"
          git push origin HEAD:stabilization/vcl-2.1-cleanup
