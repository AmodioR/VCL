name: Apply persistent nav shell

on:
  push:
    branches:
      - stabilization/vcl-2.1-cleanup
    paths:
      - .github/workflows/apply-persistent-nav-shell.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stabilization/vcl-2.1-cleanup

      - name: Stabilize and prehydrate shared navigation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          bootstrap = r'''(() => {
            const KEY = "vcl-nav-visual-state-v1";
            const MAX_AGE = 12 * 60 * 60 * 1000;

            const escapeHTML = (value = "") =>
              String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/\"/g, "&quot;")
                .replace(/'/g, "&#039;");

            const read = () => {
              try {
                const state = JSON.parse(localStorage.getItem(KEY) || "null");
                if (!state?.updatedAt || Date.now() - state.updatedAt > MAX_AGE) return null;
                return state;
              } catch (_) {
                return null;
              }
            };

            const write = (state) => {
              try {
                localStorage.setItem(KEY, JSON.stringify({ ...state, updatedAt: Date.now() }));
              } catch (_) {}
            };

            const button = document.querySelector(".site-header .nav-actions a.btn");
            const cached = read();

            if (button && cached?.loggedIn && cached.displayName) {
              const initial = String(cached.displayName).trim().charAt(0).toUpperCase() || "V";
              button.href = "account.html";
              button.classList.remove("auth-nav-ready");
              button.classList.add("nav-account-trigger");
              button.innerHTML = `
                <span class="nav-account-trigger__avatar">${cached.avatarUrl ? `<img src="${escapeHTML(cached.avatarUrl)}" alt="">` : escapeHTML(initial)}</span>
                <span class="nav-account-trigger__label">${escapeHTML(cached.displayName)}</span>
                <span class="nav-account-trigger__chevron" aria-hidden="true"></span>
              `;
            } else if (button && cached?.loggedIn === false) {
              button.href = "login.html";
              button.classList.remove("nav-account-trigger");
              button.classList.add("auth-nav-ready");
              button.innerHTML = "<span>Login</span>";
            }

            const syncFromLiveNav = () => {
              const liveButton = document.querySelector(".site-header .nav-actions a.btn");
              if (!liveButton) return;

              if (liveButton.classList.contains("nav-account-trigger")) {
                const displayName = liveButton.querySelector(".nav-account-trigger__label")?.textContent?.trim();
                const avatarUrl = liveButton.querySelector(".nav-account-trigger__avatar img")?.getAttribute("src") || "";
                if (displayName) write({ loggedIn: true, displayName, avatarUrl });
                return;
              }

              const label = liveButton.textContent?.trim().toLowerCase();
              if (label === "login") write({ loggedIn: false });
            };

            const navActions = document.querySelector(".site-header .nav-actions");
            if (navActions) {
              new MutationObserver(syncFromLiveNav).observe(navActions, {
                subtree: true,
                childList: true,
                attributes: true,
                characterData: true
              });
            }

            document.addEventListener("click", (event) => {
              if (event.target.closest("[data-nav-account-logout], [data-logout-button]")) {
                write({ loggedIn: false });
              }
            }, true);

            syncFromLiveNav();
          })();
          '''
          Path('assets/js/navStateBootstrap.js').write_text(bootstrap, encoding='utf-8')

          script_tag = '<script src="assets/js/navStateBootstrap.js?v=2.1-nav-state-01"></script>'
          css_link = '  <link rel="stylesheet" href="assets/css/account-interface-v4.css?v=2.1-account-v4-01">\n'

          for path in Path('.').glob('*.html'):
              html = path.read_text(encoding='utf-8')
              if '<header class="site-header">' not in html:
                  continue
              if 'assets/css/account-interface-v4.css' not in html:
                  html = html.replace('</head>', css_link + '</head>', 1)
              if 'assets/js/navStateBootstrap.js' not in html:
                  html = html.replace('</header>', '</header>\n' + script_tag, 1)
              path.write_text(html, encoding='utf-8')

          css_path = Path('assets/css/account-interface-v4.css')
          css = css_path.read_text(encoding='utf-8')

          css = re.sub(
              r'/\* Keep the static Login/Account placeholder from flashing before Supabase resolves auth\. \*/\n'
              r'\.site-header \.nav-actions > a\.btn:not\(\.nav-account-trigger\) \{.*?'
              r'\.nav-account-shell\.auth-nav-ready \{\n  visibility: visible;\n\}\n\n',
              '',
              css,
              count=1,
              flags=re.S
          )

          marker = '/* ---------- Shared authenticated account menu ---------- */\n'
          stable = '''/* Stable multi-page nav shell: same geometry on every page, with cached visual auth state. */
          html { scrollbar-gutter: stable; }

          @media (min-width: 1081px) {
            .site-header .nav {
              grid-template-columns: 126px minmax(0, 1fr) 190px;
            }

            .site-header .nav-actions {
              width: 190px;
              justify-content: flex-end;
            }

            .site-header .nav-account-shell {
              width: 190px;
              display: flex;
              justify-content: flex-end;
            }
          }

          '''
          if stable not in css:
              if marker not in css:
                  raise SystemExit('Shared account menu marker not found')
              css = css.replace(marker, marker + stable, 1)

          css_path.write_text(css, encoding='utf-8')
          PY

      - name: Run static frontend audit
        run: node tools/vcl-static-audit.mjs

      - name: Commit persistent nav shell
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-persistent-nav-shell.yml
          git add '*.html' assets/css/account-interface-v4.css assets/js/navStateBootstrap.js
          git commit -m "Stabilize shared navigation across page loads"
          git push origin HEAD:stabilization/vcl-2.1-cleanup
