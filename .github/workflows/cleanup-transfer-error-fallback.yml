name: Cleanup transfer error fallback

on:
  push:
    branches:
      - stabilization/vcl-2.1-cleanup
    paths:
      - .github/workflows/cleanup-transfer-error-fallback.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stabilization/vcl-2.1-cleanup
          fetch-depth: 0

      - name: Remove obsolete transfer migration error path
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('assets/js/teamTransferManager.js')
          text = path.read_text()
          old_line = "      const missing = ['42883', 'PGRST202', 'PGRST204'].includes(error?.code);\n"
          old_title = "${missing ? 'Direct transfer-backenden mangler' : 'Transfers kunne ikke indlæses'}"
          old_copy = "${missing ? 'Kør 20260908_direct_team_transfers.sql i Supabase og genindlæs siden.' : 'Prøv at genindlæse siden om et øjeblik.'}"
          for old in (old_line, old_title, old_copy):
              if old not in text:
                  raise SystemExit(f'Expected transfer fallback snippet not found: {old!r}')
          text = text.replace(old_line, '', 1)
          text = text.replace(old_title, 'Transfers kunne ikke indlæses', 1)
          text = text.replace(old_copy, 'Prøv at genindlæse siden om et øjeblik.', 1)
          if 'Direct transfer-backenden mangler' in text or '20260908_direct_team_transfers.sql' in text:
              raise SystemExit('Transfer migration fallback still present')
          path.write_text(text)
          PY

      - name: Run static frontend audit
        run: node tools/vcl-static-audit.mjs

      - name: Commit cleanup
        run: |
          git rm .github/workflows/cleanup-transfer-error-fallback.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/teamTransferManager.js
          git commit -m "Remove obsolete transfer migration fallback"
          git push origin HEAD:stabilization/vcl-2.1-cleanup
