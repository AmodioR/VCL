name: Cleanup tournament migration fallbacks

on:
  push:
    branches:
      - stabilization/vcl-2.1-cleanup
    paths:
      - .github/workflows/cleanup-tournament-migration-fallbacks.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stabilization/vcl-2.1-cleanup
          fetch-depth: 0

      - name: Remove obsolete migration-missing compatibility branches
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('assets/js/tournamentEntryFlow.js')
          text = path.read_text()

          text, load_count = re.subn(
              r"\n\s*const migrationMissing = \['42883', 'PGRST202', 'PGRST204'\]\.includes\(error\.code\);\n\s*if \(migrationMissing\) \{\n\s*console\.warn\('Tournament roster migration er ikke installeret endnu\.', error\);\n\s*return null;\n\s*\}",
              '',
              text,
              count=1,
          )

          text, submit_count = re.subn(
              r"\n\s*const migrationMissing = \['42883', 'PGRST202', 'PGRST204'\]\.includes\(error\?\.code\);\n\s*setStatus\(\n\s*migrationMissing\n\s*\? 'Tournament roster-systemet mangler Supabase-migrationen\.'\n\s*: error\?\.message \|\| 'Holdets tournament roster kunne ikke gemmes\.',\n\s*'error'\n\s*\);",
              "\n      setStatus(\n        error?.message || 'Holdets tournament roster kunne ikke gemmes.',\n        'error'\n      );",
              text,
              count=1,
          )

          if load_count != 1:
              raise SystemExit(f'loadSavedRoster compatibility block matches: {load_count}')
          if submit_count != 1:
              raise SystemExit(f'submitRoster compatibility block matches: {submit_count}')

          path.write_text(text)
          PY

      - name: Run static frontend audit
        run: node tools/vcl-static-audit.mjs

      - name: Commit cleanup
        run: |
          git rm .github/workflows/cleanup-tournament-migration-fallbacks.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/tournamentEntryFlow.js
          git commit -m "Remove obsolete tournament migration fallbacks"
          git push origin HEAD:stabilization/vcl-2.1-cleanup
