name: Cleanup admin runtime method guards

on:
  push:
    branches:
      - stabilization/vcl-2.1-cleanup
    paths:
      - .github/workflows/cleanup-admin-method-guards.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stabilization/vcl-2.1-cleanup
          fetch-depth: 0

      - name: Remove obsolete admin method guards
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('script.js')
          text = path.read_text()

          simple_replacements = [
              (
                  'if (!adminTournamentList || !window.VCLData.getAdminTournaments) return;',
                  'if (!adminTournamentList) return;'
              ),
              (
                  'if (!adminTournamentSettlement || !window.VCLData.getTournamentSettlementPreview) return;',
                  'if (!adminTournamentSettlement) return;'
              ),
              (
                  '''async function loadAdminTeamSignups() {\n  if (!adminTeamSignupsList || !window.VCLData.getAdminTeamSignups) {\n    return;\n  }''',
                  '''async function loadAdminTeamSignups() {\n  if (!adminTeamSignupsList) {\n    return;\n  }'''
              ),
              (
                  'if (!adminAvatarList || !window.VCLData.getAdminPendingPlayerAvatars) return;',
                  'if (!adminAvatarList) return;'
              ),
              (
                  '''async function loadAdminUnclaimedProfiles() {\n      if (!adminUnclaimedList || !window.VCLData.getAdminUnclaimedProfiles) {\n        return;\n      }''',
                  '''async function loadAdminUnclaimedProfiles() {\n      if (!adminUnclaimedList) {\n        return;\n      }'''
              ),
              (
                  '''async function loadAdminNews() {\n  if (!adminNewsList || !window.VCLData.getAdminNewsPosts) return;''',
                  '''async function loadAdminNews() {\n  if (!adminNewsList) return;'''
              ),
              (
                  '''        if (!window.VCLData.getAdminSignupClaimTargets) {\n          throw new Error("getAdminSignupClaimTargets mangler i vclData.js");\n        }\n\n        if (!window.VCLData.adminCreateClaimInvite) {\n          throw new Error("adminCreateClaimInvite mangler i vclData.js");\n        }\n\n''',
                  ''
              )
          ]

          for old, new in simple_replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one admin compatibility block, found {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          old_validation = '''        if (window.VCLData.adminValidateTeamSignup) {\n          const validation = await window.VCLData.adminValidateTeamSignup(signupId);\n\n          const errors = Array.isArray(validation.errors)\n            ? validation.errors\n            : [];\n\n          const warnings = Array.isArray(validation.warnings)\n            ? validation.warnings\n            : [];\n\n          if (!validation.valid || errors.length) {\n            if (status) {\n              status.dataset.status = "error";\n              status.innerHTML = `\n                <strong>Kan ikke godkendes:</strong>\n                <ul>\n                  ${errors\n                    .map((error) => `<li>${escapeHTML(error)}</li>`)\n                    .join("")}\n                </ul>\n              `;\n            }\n\n            return;\n          }\n\n          if (warnings.length) {\n            const continueWithWarnings = confirm(\n              `Advarsler for ${teamName}:\\n\\n${warnings\n                .map((warning) => `- ${warning}`)\n                .join("\\n")}\\n\\nVil du stadig godkende holdet?`\n            );\n\n            if (!continueWithWarnings) {\n              if (status) {\n                status.textContent = "Approval afbrudt.";\n                status.dataset.status = "info";\n              }\n\n              return;\n            }\n          }\n        }\n'''

          new_validation = '''        const validation = await window.VCLData.adminValidateTeamSignup(signupId);\n\n        const errors = Array.isArray(validation.errors)\n          ? validation.errors\n          : [];\n\n        const warnings = Array.isArray(validation.warnings)\n          ? validation.warnings\n          : [];\n\n        if (!validation.valid || errors.length) {\n          if (status) {\n            status.dataset.status = "error";\n            status.innerHTML = `\n              <strong>Kan ikke godkendes:</strong>\n              <ul>\n                ${errors\n                  .map((error) => `<li>${escapeHTML(error)}</li>`)\n                  .join("")}\n              </ul>\n            `;\n          }\n\n          return;\n        }\n\n        if (warnings.length) {\n          const continueWithWarnings = confirm(\n            `Advarsler for ${teamName}:\\n\\n${warnings\n              .map((warning) => `- ${warning}`)\n              .join("\\n")}\\n\\nVil du stadig godkende holdet?`\n          );\n\n          if (!continueWithWarnings) {\n            if (status) {\n              status.textContent = "Approval afbrudt.";\n              status.dataset.status = "info";\n            }\n\n            return;\n          }\n        }\n'''

          count = text.count(old_validation)
          if count != 1:
              raise SystemExit(f'Expected one optional admin signup validation block, found {count}')
          text = text.replace(old_validation, new_validation, 1)

          forbidden = [
              '!window.VCLData.getAdminTournaments',
              '!window.VCLData.getTournamentSettlementPreview',
              '!window.VCLData.getAdminTeamSignups',
              'if (window.VCLData.adminValidateTeamSignup)',
              '!window.VCLData.getAdminSignupClaimTargets',
              '!window.VCLData.adminCreateClaimInvite',
              '!window.VCLData.getAdminPendingPlayerAvatars',
              '!window.VCLData.getAdminUnclaimedProfiles',
              '!window.VCLData.getAdminNewsPosts'
          ]
          for token in forbidden:
              if token in text:
                  raise SystemExit(f'Obsolete admin runtime guard still present: {token}')

          path.write_text(text)
          PY

      - name: Run static frontend audit
        run: node tools/vcl-static-audit.mjs

      - name: Commit cleanup
        run: |
          git rm .github/workflows/cleanup-admin-method-guards.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js
          git commit -m "Remove obsolete admin runtime method guards"
          git push origin HEAD:stabilization/vcl-2.1-cleanup
