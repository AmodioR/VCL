name: Cleanup admin runtime loaders

on:
  push:
    branches:
      - stabilization/vcl-2.1-cleanup
    paths:
      - .github/workflows/cleanup-admin-runtime-loaders.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stabilization/vcl-2.1-cleanup
          fetch-depth: 0

      - name: Make admin dependencies explicit
        run: |
          python3 - <<'PY'
          from pathlib import Path

          admin = Path('admin.html')
          html = admin.read_text()

          old_style = '<link rel="stylesheet" href="styles.css?v=2.1-live-broadcast-01">'
          new_style = old_style + '\n  <link rel="stylesheet" href="assets/css/admin-tournament-roster.css?v=2.1-tournament-roster-01">'
          if html.count(old_style) != 1:
              raise SystemExit(f'Expected one admin core stylesheet marker, found {html.count(old_style)}')
          html = html.replace(old_style, new_style, 1)

          old_scripts = '''<script src="assets/js/adminWorkspace.js?v=2.1-live-broadcast-01"></script>\n</body>'''
          new_scripts = '''<script src="assets/js/adminWorkspace.js?v=2.1-live-broadcast-01"></script>\n<script src="assets/js/adminHomeLatestResult.js?v=2.1-home-result-02"></script>\n<script src="assets/js/adminTournamentRosterPreview.js?v=2.1-tournament-roster-01"></script>\n</body>'''
          if html.count(old_scripts) != 1:
              raise SystemExit(f'Expected one admin script tail, found {html.count(old_scripts)}')
          html = html.replace(old_scripts, new_scripts, 1)
          admin.write_text(html)

          workspace = Path('assets/js/adminWorkspace.js')
          js = workspace.read_text()

          old_loader = '''  if (\n    page.querySelector('#admin-tournaments') &&\n    !document.querySelector('script[data-admin-home-result-loader]')\n  ) {\n    const script = document.createElement('script');\n    script.src = 'assets/js/adminHomeLatestResult.js?v=2.1-home-result-02';\n    script.dataset.adminHomeResultLoader = 'true';\n    document.body.appendChild(script);\n  }\n\n  if (page.querySelector('[data-admin-tournament-entries]')) {\n    if (!document.querySelector('link[data-admin-tournament-roster-style]')) {\n      const link = document.createElement('link');\n      link.rel = 'stylesheet';\n      link.href = 'assets/css/admin-tournament-roster.css?v=2.1-tournament-roster-01';\n      link.dataset.adminTournamentRosterStyle = 'true';\n      document.head.appendChild(link);\n    }\n\n    if (!document.querySelector('script[data-admin-tournament-roster-loader]')) {\n      const script = document.createElement('script');\n      script.src = 'assets/js/adminTournamentRosterPreview.js?v=2.1-tournament-roster-01';\n      script.dataset.adminTournamentRosterLoader = 'true';\n      document.body.appendChild(script);\n    }\n  }\n\n'''
          if js.count(old_loader) != 1:
              raise SystemExit(f'Expected one admin dynamic loader block, found {js.count(old_loader)}')
          js = js.replace(old_loader, '', 1)

          forbidden = [
              'data-admin-home-result-loader',
              'data-admin-tournament-roster-loader',
              'data-admin-tournament-roster-style',
              "document.createElement('script')",
              "document.createElement('link')"
          ]
          for token in forbidden:
              if token in js:
                  raise SystemExit(f'Obsolete admin runtime loader remains: {token}')

          workspace.write_text(js)
          PY

      - name: Run static frontend audit
        run: node tools/vcl-static-audit.mjs

      - name: Commit cleanup
        run: |
          git rm .github/workflows/cleanup-admin-runtime-loaders.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html assets/js/adminWorkspace.js
          git commit -m "Make admin dependencies deterministic"
          git push origin HEAD:stabilization/vcl-2.1-cleanup
