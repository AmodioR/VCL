name: Cleanup profile demo fallbacks

on:
  push:
    branches:
      - stabilization/vcl-2.1-cleanup
    paths:
      - .github/workflows/cleanup-profile-demo-fallbacks.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stabilization/vcl-2.1-cleanup
          fetch-depth: 0

      - name: Remove hardcoded public profile defaults
        run: python3 tools/cleanup_profile_demo_fallbacks.py

      - name: Commit cleanup
        run: |
          git rm .github/workflows/cleanup-profile-demo-fallbacks.yml
          git rm tools/cleanup_profile_demo_fallbacks.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js
          git commit -m "Remove public profile demo fallbacks"
          git push origin HEAD:stabilization/vcl-2.1-cleanup
