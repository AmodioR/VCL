name: Cleanup team invite recipient fallbacks

on:
  push:
    branches:
      - stabilization/vcl-2.1-cleanup
    paths:
      - .github/workflows/cleanup-team-invite-recipient-fallbacks.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stabilization/vcl-2.1-cleanup
          fetch-depth: 0

      - name: Remove legacy invite recipient fallbacks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('assets/js/vclData.js')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(r'  const recipientColumns = \[.*?  return \[\];\n\},\n\nasync acceptTeamInvite', re.S)
          lines = [
              '  const { data, error } = await db',
              '    .from("team_invites_view")',
              '    .select("*")',
              '    .eq("status", "pending")',
              '    .eq("invited_player_id", claimedPlayer.id)',
              '    .order("created_at", { ascending: false });',
              '',
              '  if (error) {',
              '    console.error("Kunne ikke hente mine team invites:", error);',
              '    return [];',
              '  }',
              '',
              '  return data || [];',
              '},',
              '',
              'async acceptTeamInvite',
          ]
          updated, count = pattern.subn('\n'.join(lines), text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one legacy recipient fallback block, replaced {count}')
          if 'recipientColumns' in updated or 'recipient_player_id' in updated or 'target_player_id' in updated:
              raise SystemExit('Legacy team invite recipient compatibility remains')
          path.write_text(updated, encoding='utf-8')
          PY

      - name: Commit cleanup
        run: |
          git rm .github/workflows/cleanup-team-invite-recipient-fallbacks.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/vclData.js
          git commit -m "Use canonical team invite recipient column"
          git push origin HEAD:stabilization/vcl-2.1-cleanup
