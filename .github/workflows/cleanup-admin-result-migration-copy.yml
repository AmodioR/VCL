name: Cleanup admin result migration copy

on:
  push:
    branches:
      - stabilization/vcl-2.1-cleanup
    paths:
      - .github/workflows/cleanup-admin-result-migration-copy.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stabilization/vcl-2.1-cleanup
          fetch-depth: 0

      - name: Remove obsolete migration instruction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('assets/js/adminHomeLatestResult.js')
          text = path.read_text()
          old = "    setStatus('Kunne ikke indlæse forside-resultat. Kør de nye Supabase-migrationer først.', 'error');"
          new = "    setStatus('Kunne ikke indlæse forside-resultatet. Prøv at genindlæse siden om et øjeblik.', 'error');"
          if old not in text:
              raise SystemExit('Obsolete admin migration instruction not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Run static frontend audit
        run: node tools/vcl-static-audit.mjs

      - name: Commit cleanup
        run: |
          git rm .github/workflows/cleanup-admin-result-migration-copy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/adminHomeLatestResult.js
          git commit -m "Remove obsolete admin migration instruction"
          git push origin HEAD:stabilization/vcl-2.1-cleanup
