name: Cleanup stale setup copy

on:
  push:
    branches:
      - stabilization/vcl-2.1-cleanup
    paths:
      - .github/workflows/cleanup-stale-setup-copy.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stabilization/vcl-2.1-cleanup
          fetch-depth: 0

      - name: Remove stale migration instructions
        run: python3 tools/cleanup_stale_setup_copy.py

      - name: Commit cleanup
        run: |
          git rm .github/workflows/cleanup-stale-setup-copy.yml
          git rm tools/cleanup_stale_setup_copy.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js
          git commit -m "Remove stale migration setup copy"
          git push origin HEAD:stabilization/vcl-2.1-cleanup
