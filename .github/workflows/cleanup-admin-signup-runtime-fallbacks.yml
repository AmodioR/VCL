name: Cleanup admin signup runtime fallbacks

on:
  push:
    branches:
      - stabilization/vcl-2.1-cleanup
    paths:
      - .github/workflows/cleanup-admin-signup-runtime-fallbacks.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stabilization/vcl-2.1-cleanup
          fetch-depth: 0

      - name: Remove obsolete admin signup compatibility fallbacks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          path = Path('assets/js/vclData.js')
          text = path.read_text()

          signup_pattern = re.compile(
              r'''async getAdminTeamSignups\(\) \{.*?\n\},\n\nasync adminApproveTeamSignup\(signupId\) \{.*?\n\},\n\nasync getAdminSignupClaimTargets''',
              re.S,
          )

          replacement = textwrap.dedent('''
          async getAdminTeamSignups() {
            const { data, error } = await db
              .from("team_signups")
              .select(`
                *,
                tournaments:tournament_id (
                  id,
                  slug,
                  name,
                  status,
                  starts_at
                ),
                approved_team:approved_team_id (
                  id,
                  slug,
                  name
                )
              `)
              .order("created_at", { ascending: false });

            if (error) {
              console.error("Kunne ikke hente team signups:", error);
              throw error;
            }

            return (data || []).map((signup) => ({
              ...signup,
              tournament_label:
                signup.tournaments?.name || signup.tournament_label || signup.series_slug || "VCL Signup",
              tournament_slug:
                signup.tournaments?.slug || signup.tournament_slug || "",
              approved_team_slug:
                signup.approved_team?.slug || signup.approved_team_slug || ""
            }));
          },

          async adminApproveTeamSignup(signupId) {
            const { data, error } = await db.rpc("admin_approve_team_signup_linked", {
              p_signup_id: signupId
            });

            if (error) {
              console.error("Kunne ikke approve team signup:", error);
              throw error;
            }

            return Array.isArray(data) ? data[0] : data;
          },

          async getAdminSignupClaimTargets''').lstrip()

          text, count = signup_pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one admin signup compatibility block, replaced {count}')

          forbidden = [
              'Primær team-registration query fejlede. Bruger kompatibilitets-view:',
              'linkedFunctionMissing',
          ]
          for token in forbidden:
              if token in text:
                  raise SystemExit(f'Obsolete admin signup fallback still present: {token}')

          path.write_text(text)
          PY

      - name: Run static frontend audit
        run: node tools/vcl-static-audit.mjs

      - name: Commit cleanup
        run: |
          git rm .github/workflows/cleanup-admin-signup-runtime-fallbacks.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/vclData.js
          git commit -m "Remove obsolete admin signup runtime fallbacks"
          git push origin HEAD:stabilization/vcl-2.1-cleanup
